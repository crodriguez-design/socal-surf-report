<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d12">
<title>SoCal Surf Check</title>
<!-- Install-as-app: icon, name, full-screen on the home screen -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surf Check">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* =====================================================================
   THEME — every color lives here; change these and the page follows.
   Rating colors are "ocean" tones, not traffic lights:
     Perfect  = luminous aqua   (most inviting)
     Good     = kelp green      (inviting, calmer)
     Mid/Fun  = cool slate      (neutral)
     Don't Go = soft coral      (clear caution, not alarm-red)
   ===================================================================== */
:root{
  --bg:        #080d12;   /* page */
  --surface:   #101820;   /* cards */
  --surface-2: #16212b;   /* tiles / rows inside cards */
  --line:      #1f2c38;   /* hairlines */
  --ink:       #f1f5f8;   /* primary text */
  --muted:     #94a5b4;   /* secondary text */
  --faint:     #6f8292;   /* labels, captions */
  --ocean:     #5ab8ff;   /* tide line, swell arrows, accents */

  --perfect:   #34e2c8;
  --good:      #7bd8a2;
  --mid:       #aab6c3;
  --dontgo:    #f39a86;

  /* wind relative to the beach */
  --offshore:  var(--perfect);
  --cross:     #e6c27a;   /* sand */
  --onshore:   var(--dontgo);

  --radius: 18px;
  --gap: 12px;
}
/* tier / wind classes set --c; pills, chips, bars and borders read it */
.t3{--c:var(--perfect)} .t2{--c:var(--good)} .t1{--c:var(--mid)} .t0{--c:var(--dontgo)}
.w-off{--c:var(--offshore)} .w-cross{--c:var(--cross)} .w-on{--c:var(--onshore)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--ocean)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
small{font-size:.5em;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px}
.brand{font-weight:750;letter-spacing:-.02em;font-size:17px}
.brand span{color:var(--ocean)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{color:var(--bg);background:var(--ink);border-color:var(--ink);font-weight:650}
.settings{display:flex;gap:6px}
.settings select,.icon-btn{font:inherit;font-size:13px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:5px 8px;cursor:pointer}

/* ---------- generic ---------- */
main{padding:14px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:var(--gap)}
.h,.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
/* chips = compact "why" tags, colored by that factor's tier */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:12.5px;font-weight:600;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--c);margin-right:6px}
.grid2{display:grid;gap:var(--gap);grid-template-columns:1fr}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }

/* ---------- hero: the answer at a glance ---------- */
.hero{padding:18px;border-color:color-mix(in srgb,var(--c) 28%,var(--line));
  background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--c) 13%,transparent),transparent 60%),var(--surface)}
.hero .eyebrow{margin-bottom:6px}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:14px}
.rating-word{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--c);line-height:1.05}
.summary{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--ink);opacity:.92;max-width:34ch}
.ring{width:68px;height:68px;flex:none}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
@media (min-width:600px){ .glance{grid-template-columns:1.3fr 1fr 1fr .8fr} }
.g{background:var(--surface-2);border-radius:14px;padding:11px 12px;min-width:0}
.g .k{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.g .v{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.g .v.big{font-size:38px;line-height:1.05;letter-spacing:-.03em}
.g .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .s.c{color:var(--c);font-weight:650}
.g-row{display:flex;align-items:center;gap:10px}
.held{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.held .k{font-size:12px;color:var(--faint);margin-right:2px}
.sections{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* "Why this rating?" */
details.why{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;list-style:none;font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-right:4px}
details[open] summary::after{transform:rotate(-135deg)}
.factor{display:grid;grid-template-columns:78px 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.factor:last-of-type{border-bottom:0}
.factor .fk{font-size:12.5px;color:var(--faint)}
.factor .fv{font-weight:650;font-size:14px}
.factor .need{grid-column:2/4;font-size:12.5px;color:var(--faint)}
.why-note{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* ---------- day strip ---------- */
.days{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px;margin-bottom:var(--gap);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 min(44%,190px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative;overflow:hidden}
.day::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.day .dn{font-size:11.5px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.day .dr{font-size:18px;font-weight:750;color:var(--c);margin:3px 0 2px;letter-spacing:-.01em}
.day .dw{font-size:13px;color:var(--muted)}
.day .dw b{color:var(--ink)}
.day .dt{margin-top:6px;min-height:16px}

/* ---------- hourly ---------- */
.hhead,.hr{display:grid;grid-template-columns:34px minmax(0,1fr) 52px 50px 44px;gap:2px 8px;align-items:center}
.hhead{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px}
.hhead :nth-child(n+3){text-align:right}
.hours-day{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:14px 4px 6px;position:sticky;top:96px;background:var(--surface);z-index:1}
.hr{padding:10px;border-radius:12px;margin-bottom:4px;background:var(--surface-2);position:relative}
.hr::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--c)}
.hr.best{background:color-mix(in srgb,var(--c) 9%,var(--surface-2))}
.hr .t{font-size:13px;color:var(--muted);padding-left:4px}
.hr .r{min-width:0;display:flex;flex-direction:column}
.hr .r b{color:var(--c);font-size:14px;white-space:nowrap}
.hr .r .tags{white-space:nowrap;overflow:hidden;line-height:1.3}
.hr .best-tag{font-size:10.5px;font-weight:700;color:var(--bg);background:var(--c);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.hr .ht{font-weight:750;font-size:15px;text-align:right;line-height:1.2}
.hr .ht span{display:block;font-size:11.5px;font-weight:500;color:var(--faint)}
.hr .wd{font-size:14px;font-weight:600;display:flex;align-items:center;gap:3px;justify-content:flex-end;color:var(--c)}
.hr .td{font-size:13px;text-align:right;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--c)}

/* ---------- rows (swell, buoy) ---------- */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-of-type{border-bottom:0}
.row .l{color:var(--muted)}
.row .rv{display:flex;align-items:center;gap:6px}
.expo{display:inline-block;width:40px;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.expo i{display:block;height:100%;background:var(--ocean)}
.note{font-size:12.5px;color:var(--faint);margin-top:8px}
.banner{border-color:color-mix(in srgb,var(--dontgo) 45%,var(--line));background:color-mix(in srgb,var(--dontgo) 8%,var(--surface));font-size:14px}

/* ---------- tide high/low chips ---------- */
.hilo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.hilo div{background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.hilo .lbl{color:var(--muted)}

/* ---------- spot guide (collapsible) ---------- */
details.guide summary{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tier{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tier:first-of-type{margin-top:8px}
.tier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.tier dt{color:var(--faint)} .tier dd{margin:0}
ul.other{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}

/* ---------- timeline scrubber ---------- */
#sc-svg{width:100%;height:auto;display:block;margin-top:10px;cursor:ew-resize;
  touch-action:pan-y;                 /* vertical swipes scroll the page; sideways drags move the line */
  user-select:none;-webkit-user-select:none}
#sc-range{width:100%;margin:8px 0 0;accent-color:var(--ocean)}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc-size{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.sc-sum{font-size:13.5px;color:var(--muted);margin-top:4px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.sc-grid .k{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.sc-l{font-size:13px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:1.6}
.sc-lim{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:26px}

svg text{font-family:inherit}
footer{padding:8px 0 40px;font-size:12px;color:var(--faint);line-height:1.6}
.err{color:var(--dontgo)}
.skeleton{height:260px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* slide-in when switching spots (swipe or tab) */
#app.in-next{animation:inNext .24s ease-out}
#app.in-prev{animation:inPrev .24s ease-out}
@keyframes inNext{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ #app.in-next,#app.in-prev{animation:none} }
/* installed app: keep the header clear of the iPhone notch / status bar */
header{padding-top:env(safe-area-inset-top)}
.hours-day{top:calc(96px + env(safe-area-inset-top))}
footer{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.offline{border-color:color-mix(in srgb,var(--cross) 45%,var(--line));background:color-mix(in srgb,var(--cross) 8%,var(--surface));font-size:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">SoCal <span>Surf Check</span></div>
      <div class="settings">
        <select id="unitH" aria-label="Height units"><option value="ft">ft</option><option value="m">m</option></select>
        <select id="unitW" aria-label="Wind units"><option value="kt">kt</option><option value="mph">mph</option><option value="kmh">km/h</option></select>
        <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="app"><div class="skeleton"></div></main>

<footer class="wrap">
  <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
  (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>) ·
  Tides: <a href="https://tidesandcurrents.noaa.gov/" target="_blank" rel="noopener">NOAA CO-OPS</a> ·
  Buoys: <a href="https://cdip.ucsd.edu/" target="_blank" rel="noopener">CDIP / Scripps</a>.<br>
  Surf heights and ratings are this page's own estimates from model data, rated against each spot's researched criteria (spot-guide.md).
</footer>

<script>
/* =====================================================================
   SPOT CONFIG — edit this block to add / tune spots.
   ---------------------------------------------------------------------
   lat/lon      : the break (Open-Meteo picks the nearest sea grid cell)
   facing       : compass direction the beach faces, looking out to sea.
                  Offshore wind blows FROM facing+180.
   swellWindow  : [direction swell comes FROM, exposure 0..1] points used
                  to estimate how much of each offshore swell reaches the
                  break (island / headland shadowing). Linear between points.
   shadows      : extra cut for SHORT-period swell from an arc (islands
                  block short period; long period wraps). Full cut ≤10 s,
                  none ≥15 s.
   calib        : multiply the height estimate. Lower it if the page reads
                  bigger than what you actually see.
   tideStation  : NOAA CO-OPS id (tidesandcurrents.noaa.gov/map)
   buoy         : CDIP station id (optional; cdip.ucsd.edu), buoyName for display
   ===================================================================== */
const SPOTS = [
  /* ------------------------------------------------------------------
     HOW A SPOT IS DESCRIBED
     Geometry (used to ESTIMATE surf height from offshore model swell):
       facing, swellWindow, shadows, calib  — see comments above.
     criteria (used to RATE the surf): each factor lists the range(s) for
       perfect / good / mid. Anything outside "mid" = Don't Go.
       Ranges are inclusive [lo, hi]. dir ranges are compass degrees the
       swell comes FROM; several ranges = any of them.
       dir.combo     : top two swell trains each in one of these windows
                       (different windows) → direction counts as Perfect.
       tide.prefer   : "rising"/"falling" — the wrong direction drops a
                       Perfect tide to Good.
       wind.offshore : max kt for perfect/good/mid when wind is offshore or
                       cross-offshore. Above "mid" = Don't Go (too strong).
       wind.onshore  : max kt for good/mid when cross/onshore. Onshore is
                       never Perfect; under 4 kt any direction = Glassy (Perfect).
     All numbers come from spot-guide.md (research 2026-11-11). Tune them as
     your session reports come in.
     ------------------------------------------------------------------ */
  {
    id: "54th", name: "54th St, Newport",
    lat: 33.6300, lon: -117.9560,
    facing: 220,              // SSW-facing; offshore = NE
    // Exposure for the HEIGHT estimate. W kept fairly high after a 2026-11-11 cam check (W 275° @12s → 4–6 ft).
    swellWindow: [[150,0],[160,.4],[175,.9],[185,1],[210,1],[225,.85],[255,.75],[270,.7],[285,.45],[295,.15],[305,0]],
    shadows: [{ dir: [225, 255], cut: 0.4 }],   // Catalina (~222–256°): short-period swell loses ~40%
    calib: 1.05,
    criteria: {
      dir:    { combo: [[175,215],[255,285]],    // S + W combo is the classic
                perfect: [[175,205]], good: [[165,215],[255,285]], mid: [[160,290]] },
      period: { perfect: [13,18], good: [11,20], mid: [9,22] },
      height: { perfect: [4,6],   good: [3,7],   mid: [2,8] },        // face ft; >8 = closeouts
      tide:   { perfect: [2,4],   good: [1,4.5], mid: [0,5.5], prefer: "rising" },
      wind:   { offshore: { perfect: 10, good: 15, mid: 20 }, onshore: { good: 6, mid: 12 } },
    },
    rainSensitive: true,
    tideStation: "9410580",   // Newport Bay Entrance, Corona del Mar
    buoy: "213", buoyName: "San Pedro South",      // CDIP station (= NDBC 46253)
    notes: "Jetty-assisted beach break. Fast lefts off the north side of the groins on S swells, better rights on W swells. Minus tides go sand-sucking and closey; 5 ft+ highs get fat with backwash. Jetties hold up in light onshore better than the open beach.",
    other: ["Short-period swell from 225–255° is shadowed by Catalina", "Very long-period S (17–20 s) can close out much of Newport", "Crowded, can be aggressive", "Poor water quality after rain"],
  },
  {
    id: "malibu", name: "Malibu (1st / 2nd / 3rd Point)",
    lat: 34.0353, lon: -118.6785,
    facing: 190,              // S-facing right point; offshore = N/NE (NW is side-offshore)
    swellWindow: [[145,0],[160,.5],[180,.9],[190,1],[225,1],[240,.8],[255,.55],[270,.35],[285,.15],[300,0]],
    shadows: [{ dir: [240, 300], cut: 0.4 }],   // short-period W wraps poorly around Pt Dume
    calib: 0.75,
    criteria: {
      dir:    { perfect: [[185,225]], good: [[175,240]], mid: [[160,270]] },  // NW >285° mostly blocked
      period: { perfect: [15,22], good: [13,22], mid: [10,22] },             // points connect on 15 s+
      height: { perfect: [4,8],   good: [3,8],   mid: [1.5,10] },
      tide:   { perfect: [1.5,4], good: [1,4.5], mid: [0,5.5], prefer: "falling" },
      wind:   { offshore: { perfect: 8, good: 12, mid: 18 }, onshore: { good: 5, mid: 10 } },
    },
    sections: [
      { name: "1st Pt", minFt: 1.5 },                               // works all tides
      { name: "2nd Pt", minFt: 3, minTide: 1.0 },                   // unmakeable on low tide
      { name: "3rd Pt", minFt: 3.5, dir: [175, 240] },
      { name: "Connecting", minFt: 6, minPeriod: 15, dir: [180, 230] },
    ],
    rainSensitive: true,      // lagoon outflow
    tideStation: "9410840",   // Santa Monica
    buoy: "103", buoyName: "Topanga Nearshore",    // CDIP station (= NDBC 46268)
    notes: "Cobblestone right point. 1st Pt is the soft, consistent longboard wall; 2nd is short and hollow; 3rd is the fastest outside section. High tide (5 ft+) fills in and fats out.",
    other: ["2nd Pt unmakeable on low tide", "Points connect at ~6 ft+ on 15 s+ S/SSW", "Lagoon sand can create a closeout section mid-point", "Ultra crowded", "Stay out ~72 h after rain (lagoon outflow)"],
  },
  {
    id: "elporto", name: "El Porto, Manhattan Beach",
    lat: 33.8990, lon: -118.4195,
    facing: 250,              // WSW-facing; offshore = E/ENE
    swellWindow: [[190,0],[200,.35],[215,.55],[235,.75],[250,.9],[265,1],[295,1],[305,.7],[315,.3],[325,0]],
    calib: 1.1,               // 2026-11-11: was reading 3–4 ft vs 4–6 ft on Surfline's cam
    criteria: {
      // Perfect ONLY on a W/WNW + SSW/SW combo — a single direction walls up.
      dir:    { combo: [[265,295],[200,225]], perfect: [], good: [[215,305]], mid: [[200,310]] },
      period: { perfect: [13,17], good: [11,18], mid: [9,20] },
      height: { perfect: [5,8],   good: [4,8],   mid: [3,10] },
      tide:   { perfect: [1.5,3.5], good: [1,4.5], mid: [0,5.5], prefer: "rising" },
      // "Even a light onshore ruins it" → strict onshore limits; very strong offshore is hard to paddle into.
      wind:   { offshore: { perfect: 10, good: 12, mid: 20 }, onshore: { good: 4, mid: 9 } },
    },
    comboNeeded: true,        // no combo + >6 ft → size capped at Mid ("Great Wall of El Porto")
    rainSensitive: true,
    tideStation: "9410840",   // Santa Monica
    buoy: "028", buoyName: "Santa Monica Bay",     // CDIP station (= NDBC 46221)
    notes: "Open sandbar beach break and the South Bay's swell magnet — usually 1–2 ft bigger than neighbours. Look for the 'holes' between closeouts. Sea breeze usually by late morning. Rippy on low tide.",
    other: ["Single-direction swell = closeouts; combos make the peaks", "Sandbars shift (beach nourishment has hurt it before)", "Busy when good, little localism", "Storm-drain runoff after rain"],
  },
];

const TZ = "America/Los_Angeles";
const DAYS = 3;
</script>

<script>
/* =====================================================================
   RATING MODEL
   ---------------------------------------------------------------------
   Each factor is placed in a tier using the spot's researched criteria:
     3 Perfect · 2 Good · 1 Mid / Fun · 0 Don't Go
   Tiers become points (PTS). The overall score is mostly the WORST
   factor (one bad factor ruins a session), plus a weighted average of
   all of them:
       score = 0.7 × min(points) + 0.3 × weighted mean(points)
   Weights put spot-specific factors (direction, wind, tide, period)
   above raw size — a big swell can't buy a good rating on its own.
   ===================================================================== */
const PTS     = [1.5, 5, 7.5, 10];                 // points per tier 0..3
const WEIGHTS = { dir: 1.2, period: 1.0, height: 0.7, tide: 1.0, wind: 1.3, water: 0.5 };
const MIN_SHARE = 0.7;                              // how much the worst factor dominates
const TIERS = [                                     // overall score → label
  { min: 0, name: "Don't Go",  cls: "t0" },
  { min: 4, name: "Mid / Fun", cls: "t1" },
  { min: 7, name: "Good",      cls: "t2" },
  { min: 9, name: "Perfect",   cls: "t3" },
];
const tierOf = score => [...TIERS].reverse().find(t => score >= t.min);
const LEVEL  = TIERS;                               // factor level i → same names/colors

/* ============================ small helpers ============================ */
const $ = s => document.querySelector(s);
const store = { get(k,d){ try{ return localStorage.getItem(k) ?? d; }catch{ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch{} } };
const prefs = { h: store.get("surf.h","ft"), w: store.get("surf.w","kt"), spot: store.get("surf.spot", SPOTS[0].id) };
const M2FT = 3.28084;
const fmtH = m => m == null ? "–" : prefs.h === "ft" ? (m*M2FT).toFixed(1) : m.toFixed(1);
const hU = () => prefs.h;
const fmtW = kt => kt == null ? "–" : Math.round(prefs.w === "kt" ? kt : prefs.w === "mph" ? kt*1.15078 : kt*1.852);
const wU = () => prefs.w === "kmh" ? "km/h" : prefs.w;
const fmtRange = (loFt, hiFt) => {                  // surf range, input in feet
  const f = prefs.h === "ft" ? v => Math.max(0, Math.round(v)) : v => Math.max(0, Math.round(v/M2FT*10)/10);
  const a = f(loFt), b = f(hiFt); return a === b ? `${a}` : `${a}–${b}`;
};
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => d == null ? "–" : COMPASS[Math.round(((d%360)+360)%360/22.5)%16];
const angDiff = (a,b) => { const d = Math.abs(((a-b)%360+360)%360); return d > 180 ? 360-d : d; };
const inR   = (v, r) => !!r && v >= r[0] && v <= r[1];
const inAny = (v, rs) => (rs || []).some(r => inR(v, r));
const rangesTxt = (rs, u="") => rs && rs.length ? rs.map(r => `${r[0]}–${r[1]}${u}`).join(" or ") : "—";

/* Small arrow icon pointing the way the wind/swell is TRAVELLING (from + 180). */
const arrowIcon = (fromDeg, size=14) => fromDeg == null ? "" :
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${(fromDeg+180)%360}deg);flex:none" aria-hidden="true">
     <path d="M12 3 L19 19 L12 15 L5 19 Z" fill="currentColor"/></svg>`;

/* Times: everything is keyed by local-LA "YYYY-MM-DDTHH" strings so the page
   is correct no matter what timezone the phone is in. */
function laNowKey(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour === "24" ? "00" : p.hour}`;
}
const keyOf = s => s.slice(0,13).replace(" ","T");
const addH  = (k, n=1) => new Date(Date.UTC(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10), +k.slice(11,13)+n)).toISOString().slice(0,13);
const hourLabel = k => { const h = +k.slice(11,13); return h===0?"12a":h<12?`${h}a`:h===12?"12p":`${h-12}p`; };
const clock = s => { const h = +s.slice(11,13), m = s.slice(14,16); return `${h%12||12}:${m}${h<12?"a":"p"}`; };
const dayLabel = (k, opts={weekday:"short",month:"short",day:"numeric"}) => new Date(k.slice(0,10)+"T12:00").toLocaleDateString("en-US",opts);

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`${r.status} from ${new URL(url).host}`);
  return r.json();
}

/* ============================ data loading ============================ */
const cache = {};
async function loadSpot(spot){
  const marineVars = ["wave_height","wave_period",
    "swell_wave_height","swell_wave_direction","swell_wave_period",
    "secondary_swell_wave_height","secondary_swell_wave_direction","secondary_swell_wave_period",
    "wind_wave_height","wind_wave_direction","wind_wave_period","sea_surface_temperature"].join(",");
  const tz = encodeURIComponent(TZ);
  const marineURL = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&hourly=${marineVars}&timezone=${tz}&forecast_days=${DAYS+1}&cell_selection=sea`;
  // past_days=3 gives the last 72 h of rain for the water-quality factor
  const wxURL = `https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m&daily=sunrise,sunset,precipitation_sum&precipitation_unit=inch&past_days=3&wind_speed_unit=kn&temperature_unit=fahrenheit&timezone=${tz}&forecast_days=${DAYS+1}`;
  const today = laNowKey().slice(0,10).replace(/-/g,"");
  const tideBase = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&datum=MLLW&station=${spot.tideStation}&time_zone=lst_ldt&units=english&format=json&application=surf_dashboard&begin_date=${today}&range=${(DAYS+1)*24}`;
  const [marine, wx, tideH, tideHL, buoy] = await Promise.all([
    getJSON(marineURL), getJSON(wxURL),
    getJSON(tideBase+"&interval=h").catch(e=>({error:e.message})),
    getJSON(tideBase+"&interval=hilo").catch(e=>({error:e.message})),
    loadBuoy(spot.buoy, spot.buoyName),
  ]);
  return { marine, wx, tideH, tideHL, buoy };
}

/* Observed buoy, from CDIP (Scripps) — the same buoys NDBC republishes, but CDIP's
   THREDDS server allows browser requests (NDBC's site does not). Two tiny requests:
   1) the .dds file for the array lengths, 2) just the last value of each variable. */
async function loadBuoy(id, name){
  if(!id) return null;
  const base = `https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/realtime/${id}p1_rt.nc`;
  try {
    const dds = await (await fetch(base + ".dds", { signal: AbortSignal.timeout(8000) })).text();
    const nW = +((dds.match(/waveTime\[waveTime = (\d+)\]/) || [])[1] || 0);
    const nS = +((dds.match(/sstTime\[sstTime = (\d+)\]/) || [])[1] || 0);
    if(!nW) throw new Error("no wave data");
    const vars = ["waveTime","waveHs","waveTp","waveTa","waveDp"].map(v => `${v}[${nW-1}]`)
      .concat(nS ? ["sstTime","sstSeaSurfaceTemperature"].map(v => `${v}[${nS-1}]`) : []);
    const txt = await (await fetch(`${base}.ascii?${vars.map(encodeURIComponent).join(",")}`, { signal: AbortSignal.timeout(8000) })).text();
    const val = k => { const m = txt.match(new RegExp(`${k}\\[1\\]\\s+(-?[\\d.eE+]+)`)); const v = m ? +m[1] : null; return v == null || v < -900 ? null : v; };
    const hs = val("waveHs");
    if(hs == null) throw new Error("no recent wave data");
    return { id, name, time: new Date(val("waveTime")*1000), hs, tp: val("waveTp"), ta: val("waveTa"), dp: val("waveDp"), wtmp: val("sstSeaSurfaceTemperature") };
  } catch(e){
    return { id, name, error: "buoy data didn't load just now" };
  }
}

/* ============================ surf height estimate ============================
   1. Each swell train is scaled by the spot's exposure to its direction.
   2. Breaking height per train, Komar & Gaughan (1972):
        Hb = 0.39 · g^0.2 · (T · H0²)^0.4      (metres, seconds)
      Longer period → bigger surf from the same offshore height.
   3. Trains combined by energy (root-sum-square) × spot calib.
   ============================================================================ */
function exposure(spot, dir){
  if(dir == null) return 0;
  const w = spot.swellWindow;
  for(let i=0;i<w.length-1;i++){
    const [d0,f0] = w[i], [d1,f1] = w[i+1];
    if(dir >= d0 && dir <= d1) return f0 + (f1-f0)*(dir-d0)/(d1-d0);
  }
  return 0;
}
const breaker = (H, T) => (H>0 && T>0) ? 0.39 * Math.pow(9.81,0.2) * Math.pow(T*H*H, 0.4) : 0;

/* ============================ rate one hour ============================ */
function analyseHour(spot, m, i, wind, tide, trend, rain72){
  const C = spot.criteria;

  // ---- swell trains → estimated face height ----
  const trains = [
    { kind:"Primary",    H:m.swell_wave_height[i],             T:m.swell_wave_period[i],             D:m.swell_wave_direction[i] },
    { kind:"Secondary",  H:m.secondary_swell_wave_height?.[i], T:m.secondary_swell_wave_period?.[i], D:m.secondary_swell_wave_direction?.[i] },
    { kind:"Wind waves", H:m.wind_wave_height[i],              T:m.wind_wave_period[i],              D:m.wind_wave_direction[i] },
  ].filter(t => t.H != null && t.H > 0.05 && t.T);
  let e2 = 0, swellE = 0, tW = 0;
  for(const t of trains){
    t.exp = exposure(spot, t.D);
    for(const sh of spot.shadows || [])
      if(inR(t.D, sh.dir)) t.exp *= 1 - sh.cut * Math.min(1, Math.max(0, (15 - t.T)/5));
    t.hb = breaker(t.H * t.exp, t.T);
    e2 += t.hb*t.hb; tW += t.hb*t.hb*t.T;
    if(t.kind !== "Wind waves") swellE += t.hb*t.hb;
  }
  const hbFt = Math.sqrt(e2) * M2FT * (spot.calib ?? 1);
  const surfLo = hbFt*0.8, surfHi = hbFt*1.1, surfMid = hbFt*0.95;
  const domT = e2 ? tW/e2 : 0;                      // energy-weighted period at the break
  const cleanRatio = e2 ? swellE/e2 : 0;            // groundswell share vs local wind waves
  const ranked = trains.slice().sort((a,b)=>b.hb-a.hb);
  const top = ranked[0], second = ranked[1];
  // combo = a second train with ≥40% of the top train's breaking height, ≥30° apart
  const combo = !!(second && second.hb >= 0.4*top.hb && angDiff(top.D, second.D) >= 30);

  const F = [];   // factors: { key, name, value, level, need, note }
  const add = (key, name, value, level, need, note) => F.push({ key, name, value, level, need, note });

  // ---- 1. Swell direction (dominant train; combos can earn Perfect) ----
  {
    const c = C.dir; let lv = 0, note = "";
    if(top){
      lv = inAny(top.D, c.perfect) ? 3 : inAny(top.D, c.good) ? 2 : inAny(top.D, c.mid) ? 1 : 0;
      if(c.combo && combo){
        const w1 = c.combo.findIndex(r => inR(top.D, r)), w2 = c.combo.findIndex(r => inR(second.D, r));
        if(w1 >= 0 && w2 >= 0 && w1 !== w2){ lv = 3; note = "combo swell"; }
      }
    }
    const need = lv === 3 ? "" : lv === 2 ? `Perfect: ${rangesTxt(c.perfect,"°")}${c.combo ? ` or a ${rangesTxt([c.combo[0]],"°")} + ${rangesTxt([c.combo[1]],"°")} combo` : ""}`
               : lv === 1 ? `Good: ${rangesTxt(c.good,"°")}` : `Mid: ${rangesTxt(c.mid,"°")}`;
    add("dir", "Swell dir", top ? `${compass(top.D)} ${Math.round(top.D)}°${combo ? ` + ${compass(second.D)}` : ""}` : "–", lv, need, note);
  }
  // ---- 2. Period (energy-weighted, at the break) ----
  {
    const c = C.period; let lv = inR(domT,c.perfect)?3 : inR(domT,c.good)?2 : inR(domT,c.mid)?1 : 0, note = "";
    if(cleanRatio < 0.5 && lv > 1){ lv = 1; note = "mostly local wind waves"; }
    const need = lv === 3 ? "" : `${LEVEL[lv+1].name}: ${rangesTxt([[c.perfect,c.good,c.mid][3-(lv+1)]]," s")}`;
    add("period", "Period", `${domT.toFixed(0)} s`, lv, need, note);
  }
  // ---- 3. Size (estimated face height) ----
  {
    const c = C.height; let lv = inR(surfMid,c.perfect)?3 : inR(surfMid,c.good)?2 : inR(surfMid,c.mid)?1 : 0, note = "";
    if(surfMid > c.mid[1]) note = "too big / closing out";
    else if(surfMid < c.mid[0]) note = "too small";
    if(spot.comboNeeded && !combo && surfMid > 6 && lv > 1){ lv = 1; note = "single-direction swell walls up"; }
    const need = lv === 3 ? "" : `${LEVEL[lv+1].name}: ${rangesTxt([[c.perfect,c.good,c.mid][3-(lv+1)]]," ft")}`;
    add("height", "Size", `${fmtRange(surfLo, surfHi)} ${hU()}`, lv, need, note);
  }
  // ---- 4. Tide (ft MLLW + preferred direction) ----
  if(tide != null){
    const c = C.tide; let lv = inR(tide,c.perfect)?3 : inR(tide,c.good)?2 : inR(tide,c.mid)?1 : 0, note = "";
    const wrongWay = (c.prefer === "rising" && trend === "↓") || (c.prefer === "falling" && trend === "↑");
    if(lv === 3 && wrongWay){ lv = 2; note = `prefers ${c.prefer}`; }
    if(lv < 3) note = note || (tide > c.perfect[1] ? "too high" : "too low");
    const need = lv === 3 ? "" : lv === 2 ? `Perfect: ${rangesTxt([c.perfect]," ft")}${c.prefer ? `, ${c.prefer}` : ""}` : `${LEVEL[lv+1].name}: ${rangesTxt([[c.perfect,c.good,c.mid][3-(lv+1)]]," ft")}`;
    add("tide", "Tide", `${tide.toFixed(1)} ft ${trend}`, lv, need, note);
  }
  // ---- 5. Wind relative to the beach ----
  let windCls = "w-cross", windTag = "–";
  if(wind.spd != null && wind.dir != null){
    const c = C.wind, k = wind.spd;
    const rel = angDiff(wind.dir, (spot.facing+180)%360);     // 0° = dead offshore
    const offside = rel <= 80;                                // offshore or cross-offshore
    windTag = k < 4 ? "Glassy" : rel <= 45 ? "Offshore" : rel <= 80 ? "Cross-off" : rel <= 110 ? "Cross-shore" : rel <= 135 ? "Cross-on" : "Onshore";
    windCls = k < 4 || offside ? "w-off" : rel <= 110 ? "w-cross" : "w-on";
    let lv, need;
    if(k < 4){ lv = 3; need = ""; }
    else if(offside){
      lv = k <= c.offshore.perfect ? 3 : k <= c.offshore.good ? 2 : k <= c.offshore.mid ? 1 : 0;
      need = lv === 3 ? "" : `${LEVEL[lv+1].name}: offshore ≤${[c.offshore.perfect,c.offshore.good,c.offshore.mid][3-(lv+1)]} kt`;
    } else {
      lv = k <= c.onshore.good ? 2 : k <= c.onshore.mid ? 1 : 0;
      need = lv === 2 ? "Perfect: offshore or glassy (<4 kt)" : `${LEVEL[lv+1].name}: onshore ≤${lv === 1 ? c.onshore.good : c.onshore.mid} kt`;
    }
    add("wind", "Wind", `${fmtW(k)} ${wU()} ${compass(wind.dir)}`, lv, need, windTag.toLowerCase());
  }
  // ---- 6. Water quality (rain in the last 72 h) ----
  if(spot.rainSensitive && rain72 != null){
    const lv = rain72 >= 0.25 ? 0 : rain72 >= 0.1 ? 1 : 3;
    add("water", "Water", rain72 >= 0.01 ? `${rain72.toFixed(2)}" rain / 72 h` : "No recent rain", lv, lv === 3 ? "" : "Wait ~72 h after rain", lv < 3 ? "runoff risk" : "");
  }

  // ---- combine ----
  const pts = F.map(f => PTS[f.level]);
  const minP = Math.min(...pts);
  const wSum = F.reduce((s,f)=>s+WEIGHTS[f.key],0);
  const mean = F.reduce((s,f)=>s+WEIGHTS[f.key]*PTS[f.level],0) / wSum;
  const score = MIN_SHARE*minP + (1-MIN_SHARE)*mean;
  const minLv = Math.min(...F.map(f=>f.level));
  const limiters = F.filter(f => f.level === minLv && minLv < 3).sort((a,b)=>WEIGHTS[b.key]-WEIGHTS[a.key]);
  // what a swell-size-only rating would say (size + period, nothing else)
  const fz = k => F.find(f=>f.key===k);
  const swellOnly = (PTS[fz("height").level] + PTS[fz("period").level]) / 2;

  const sections = (spot.sections||[]).map(sec => ({
    name: sec.name,
    on: surfMid >= sec.minFt
      && (!sec.dir || (top && inR(top.D, sec.dir)))
      && (sec.minTide == null || (tide != null && tide >= sec.minTide))
      && (sec.minPeriod == null || domT >= sec.minPeriod),
  }));

  return { trains, surfLo, surfHi, surfMid, domT, combo, factors: F, score, tier: tierOf(score), limiters, swellOnly, sections, windCls, windTag };
}

/* ============================ build the 72-h model ============================ */
function build(spot, raw){
  const m = raw.marine.hourly, w = raw.wx.hourly;
  const wIdx = {}; w.time.forEach((t,i)=>wIdx[keyOf(t)]=i);
  const tide = {}; (raw.tideH.predictions||[]).forEach(p=>tide[keyOf(p.t)] = +p.v);
  const sun = {}; raw.wx.daily.time.forEach((d,i)=>sun[d] = [keyOf(raw.wx.daily.sunrise[i]), keyOf(raw.wx.daily.sunset[i])]);
  const now = laNowKey(), today = now.slice(0,10);
  const rain72 = raw.wx.daily.time.reduce((s,day,i) => day <= today ? s + (raw.wx.daily.precipitation_sum?.[i] || 0) : s, 0);

  const hours = [];
  m.time.forEach((t,i)=>{
    const k = keyOf(t);
    if(k < now || hours.length >= DAYS*24) return;
    const j = wIdx[k];
    const wind = { spd: w.wind_speed_10m?.[j], dir: w.wind_direction_10m?.[j], gust: w.wind_gusts_10m?.[j] };
    const td = tide[k] ?? null, nx = tide[addH(k)];
    const trend = (td!=null && nx!=null) ? (nx>td+.05?"↑":nx<td-.05?"↓":"→") : "";
    const sr = sun[k.slice(0,10)];
    hours.push({ k, i, wind, tide: td, trend, air: w.temperature_2m?.[j], sst: m.sea_surface_temperature?.[i],
      daylight: sr ? (k >= sr[0] && k <= sr[1]) : true, raw: m,
      a: analyseHour(spot, m, i, wind, td, trend, rain72) });
  });
  // best 2-hour daylight window per day
  const best = {};
  for(let n=0;n<hours.length-1;n++){
    const h=hours[n], h2=hours[n+1];
    if(!h.daylight || !h2.daylight) continue;
    const s = (h.a.score + h2.a.score)/2, d = h.k.slice(0,10);
    if(!best[d] || s > best[d].s) best[d] = { s, k:h.k, k2:h2.k, h };
  }
  return { rain72, hours, best, sun, hilo: raw.tideHL.predictions||[], tideAll: raw.tideH.predictions||[], tideErr: raw.tideH.error, buoy: raw.buoy };
}

/* ============================ render ============================ */
const pill = (lv, text) => `<span class="pill ${LEVEL[lv].cls}"><i class="dot"></i>${text ?? LEVEL[lv].name}</span>`;
const limText = a => a.limiters.length ? a.limiters.map(f => `${f.name.toLowerCase()}${f.note ? ` (${f.note})` : ""}`).join(" & ") : "nothing — everything lines up";
/* chips: one per limiting factor, colored by that factor's tier */
const limChips = (a, max = 3) => a.limiters.length
  ? a.limiters.slice(0, max).map(f => `<span class="chip ${LEVEL[f.level].cls}">${f.name}${f.note ? ` · ${f.note}` : ""}</span>`).join("")
  : `<span class="chip t3">Everything lines up</span>`;
/* tags: tiny version for hourly rows and day cards */
const limTags = a => a.limiters.length
  ? a.limiters.slice(0, 3).map(f => `<span class="tag ${LEVEL[f.level].cls}">${f.name.toLowerCase()}</span>`).join("")
  : `<span class="tag t3">clean</span>`;

/* Plain-language summary, e.g. "4–5 ft west swell at 12 s, light onshore wind, falling 2.6 ft tide." */
const DIR8 = ["north","northeast","east","southeast","south","southwest","west","northwest"];
const dirWord = d => DIR8[Math.round(((d%360)+360)%360/45)%8];
function summary(h){
  const a = h.a, top = a.trains.slice().sort((x,y)=>y.hb-x.hb)[0], parts = [];
  if(top) parts.push(`${fmtRange(a.surfLo,a.surfHi)} ${hU()} ${dirWord(top.D)} ${top.kind === "Wind waves" ? "wind swell" : "swell"} at ${Math.round(top.T)} s${a.combo ? " with a cross-swell" : ""}`);
  const k = h.wind.spd;
  if(k != null) parts.push(k < 4 ? "glassy" : `${k < 8 ? "light" : k < 13 ? "moderate" : k < 20 ? "fresh" : "strong"} ${a.windTag.toLowerCase()} wind`);
  if(h.tide != null) parts.push(`${h.trend === "↑" ? "rising" : h.trend === "↓" ? "falling" : "slack"} ${fmtH(h.tide/M2FT)} ${hU()} tide`);
  const s = parts.join(", ");
  return s ? s[0].toUpperCase() + s.slice(1) + "." : "";
}

/* Score ring (0–10) in the hero */
const scoreRing = score => { const r = 27, C = 2*Math.PI*r; return `
  <svg class="ring" viewBox="0 0 68 68" aria-label="Score ${score.toFixed(1)} out of 10">
    <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
    <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--c)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${(C*score/10).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 34 34)"/>
    <text x="34" y="39" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)">${score.toFixed(1)}</text>
  </svg>`; };

/* Mini wind dial for the hero: blue arc = ocean side of the beach, arrow = wind, colored by how it hits the beach */
function miniDial(spot, wind, size = 46){
  const c = size/2, R = c - 4, pt = (deg, r) => [c + r*Math.sin(deg*Math.PI/180), c - r*Math.cos(deg*Math.PI/180)];
  const [x1,y1] = pt(spot.facing-80, R), [x2,y2] = pt(spot.facing+80, R);
  let arrow = "";
  if(wind.dir != null){ const [ax,ay] = pt(wind.dir, R+1), [bx,by] = pt(wind.dir+180, R*0.35);
    arrow = `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="currentColor" stroke-width="3" stroke-linecap="round" marker-end="url(#mh)"/>`; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;color:var(--c)" aria-hidden="true">
    <defs><marker id="mh" markerWidth="3" markerHeight="3" refX="1.5" refY="1.5" orient="auto"><path d="M0,0 L3,1.5 L0,3 Z" fill="currentColor"/></marker></defs>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)" stroke-width="2"/>
    <path d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}" fill="none" stroke="var(--ocean)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    ${arrow}</svg>`;
}

/* Mini tide sparkline: next 12 hours, dot = now */
function miniTide(d){
  const v = d.hours.slice(0, 13).map(h => h.tide).filter(t => t != null);
  if(v.length < 2) return "";
  const W = 100, H = 26, lo = Math.min(...v), hi = Math.max(...v), span = Math.max(hi-lo, .5);
  const P = v.map((t,i) => [2 + i*(W-4)/(v.length-1), H-3 - (t-lo)/span*(H-6)]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:24px;display:block;margin:4px 0 2px" aria-hidden="true">
    <path d="${smoothPath(P)}" fill="none" stroke="var(--ocean)" stroke-width="2"/>
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="3.2" fill="var(--ink)"/></svg>`;
}

function render(spot, d){
  const cur = d.hours[0], a = cur.a, T = a.tier;
  const top = a.trains.slice().sort((x,y)=>y.hb-x.hb)[0];
  const next = d.hilo.find(p => keyOf(p.t) > cur.k);

  /* ---- hero: rating, plain-language summary, four glance tiles, what's holding it back ---- */
  const hero = `
  <section class="card hero ${T.cls}">
    <div class="eyebrow">${spot.name} · now ${hourLabel(cur.k)}</div>
    <div class="hero-main">
      <div><div class="rating-word">${T.name}</div><p class="summary">${summary(cur)}</p></div>
      ${scoreRing(a.score)}
    </div>
    <div class="glance">
      <div class="g"><div class="k">Surf</div>
        <div class="v big">${fmtRange(a.surfLo,a.surfHi)}<small>${hU()}</small></div>
        <div class="s">${top ? `${Math.round(top.T)}s ${compass(top.D)} ${top.kind === "Wind waves" ? "wind swell" : "swell"}` : ""}</div></div>
      <div class="g ${a.windCls}"><div class="k">Wind</div>
        <div class="g-row">${miniDial(spot, cur.wind)}<div><div class="v">${fmtW(cur.wind.spd)}<small>${wU()}</small></div>
        <div class="s c">${a.windTag}</div></div></div></div>
      <div class="g"><div class="k">Tide</div>
        <div class="v">${cur.tide != null ? fmtH(cur.tide/M2FT) : "–"}<small>${hU()} ${cur.trend === "↑" ? "rising" : cur.trend === "↓" ? "falling" : ""}</small></div>
        ${miniTide(d)}
        <div class="s">${next ? `${next.type === "H" ? "High" : "Low"} ${fmtH(+next.v/M2FT)} at ${clock(next.t)}` : ""}</div></div>
      <div class="g"><div class="k">Water</div>
        <div class="v">${cur.sst != null ? Math.round(cur.sst*9/5+32) + "°" : "–"}</div>
        <div class="s">Air ${cur.air != null ? Math.round(cur.air) + "°F" : "–"}</div></div>
    </div>
    <div class="held"><span class="k">Held back by</span>${limChips(a)}</div>
    ${a.sections.length ? `<div class="sections">${a.sections.map(s=>pill(s.on?2:0, `${s.on?"✓":"✕"} ${s.name}`)).join("")}</div>` : ""}
    <details class="why">
      <summary>Why this rating?</summary>
      ${a.factors.map(f => `
        <div class="factor">
          <div class="fk">${f.name}</div>
          <div class="fv">${f.value}${f.note ? ` <span class="faint small">· ${f.note}</span>` : ""}</div>
          <div>${pill(f.level)}</div>
          ${f.need ? `<div class="need">To move up → ${f.need}</div>` : ""}
        </div>`).join("")}
      <p class="why-note">Score = 70% worst factor + 30% weighted average. A size-only rating would say
        <b>${tierOf(a.swellOnly).name}</b> (${a.swellOnly.toFixed(1)}).</p>
    </details>
  </section>`;

  /* ---- rain banner ---- */
  const banner = spot.rainSensitive && d.rain72 >= 0.1
    ? `<div class="card banner">⚠️ <b>${d.rain72.toFixed(2)}" of rain in the last 72 h.</b> Runoff and bacteria risk here — locals wait about 3 days.</div>` : "";

  /* ---- day strip: best 2-hour daylight window per day ---- */
  const days = `<div class="days">${Object.entries(d.best).map(([day,bw]) => { const t = tierOf(bw.s), ha = bw.h.a; return `
    <div class="day ${t.cls}"><div class="dn">${dayLabel(day,{weekday:"short"})} ${dayLabel(day,{month:"numeric",day:"numeric"})}</div>
      <div class="dr">${t.name}</div>
      <div class="dw">Best ${hourLabel(bw.k)}–${hourLabel(addH(bw.k2))} · <b>${fmtRange(ha.surfLo,ha.surfHi)} ${hU()}</b></div>
      <div class="dt">${limTags(ha)}</div></div>`; }).join("")}</div>`;

  /* ---- hourly (daylight only) ---- */
  let lastDay = "", rows = "";
  for(const h of d.hours){
    if(!h.daylight && h !== d.hours[0]) continue;
    const day = h.k.slice(0,10), ha = h.a;
    if(day !== lastDay){ rows += `<div class="hours-day">${dayLabel(day)}</div>`; lastDay = day; }
    const bw = d.best[day], isBest = bw && (h.k === bw.k || h.k === bw.k2);
    const t1 = ha.trains.slice().sort((x,y)=>y.hb-x.hb)[0];
    rows += `<div class="hr ${ha.tier.cls} ${isBest?"best":""}">
      <div class="t">${hourLabel(h.k)}</div>
      <div class="r"><b>${ha.tier.name}${isBest ? `<span class="best-tag">BEST</span>` : ""}</b><span class="tags">${limTags(ha)}</span></div>
      <div class="ht">${fmtRange(ha.surfLo,ha.surfHi)}<span>${t1 ? `${t1.T.toFixed(0)}s ${compass(t1.D)}` : ""}</span></div>
      <div class="wd ${ha.windCls}">${arrowIcon(h.wind.dir, 13)}${fmtW(h.wind.spd)}</div>
      <div class="td">${h.tide!=null ? `${fmtH(h.tide/M2FT)}${h.trend}` : "–"}</div>
    </div>`;
  }
  const hourly = `<section class="card"><div class="h">Hour by hour · daylight</div>
    <div class="legend"><span class="w-off">● offshore</span><span class="w-cross">● cross</span><span class="w-on">● onshore</span><span style="color:var(--faint)">tags = what's limiting that hour</span></div>
    <div class="hhead"><span></span><span>Rating</span><span>Surf ${hU()}</span><span>Wind</span><span>Tide</span></div>
    ${rows}</section>`;

  /* ---- swell components ---- */
  const swell = `<section class="card"><div class="h">Swell components · model</div>
    ${a.trains.map(t => `<div class="row"><span class="l">${t.kind}</span>
      <span class="rv"><b>${fmtH(t.H)}${hU()}</b> ${t.T.toFixed(0)}s
        <span style="color:var(--ocean);display:inline-flex">${arrowIcon(t.D)}</span>${compass(t.D)} ${Math.round(t.D)}°
        <span class="expo" title="${Math.round(t.exp*100)}% reaches the break"><i style="width:${Math.round(t.exp*100)}%"></i></span></span></div>`).join("")}
    <div class="row"><span class="l">Combined sea</span><span>${fmtH(cur.raw.wave_height[cur.i])}${hU()} · ${cur.raw.wave_period?.[cur.i]?.toFixed(0) ?? "–"}s</span></div>
    <div class="note">Blue bar = share of that swell reaching the break after island / headland shadowing.</div>
  </section>`;

  /* ---- buoy (observed, CDIP) ---- */
  const b = d.buoy;
  const ago = b && b.time ? Math.round((Date.now() - b.time)/60000) : null;
  const buoy = `<section class="card"><div class="h">Buoy · observed</div>${
    !b ? `<div class="small muted">No buoy configured for this spot.</div>`
    : b.error ? `<div class="small muted">${b.name}: ${b.error}. The model swell on the left is still current.</div>`
    : `<div class="row"><span class="l">Waves</span><span class="rv"><b>${fmtH(b.hs)}${hU()}</b> ${b.tp != null ? b.tp.toFixed(0) + "s" : ""}
         <span style="color:var(--ocean);display:inline-flex">${arrowIcon(b.dp)}</span>${compass(b.dp)} ${b.dp != null ? Math.round(b.dp) + "°" : ""}</span></div>
       <div class="row"><span class="l">Avg period</span><span>${b.ta != null ? b.ta.toFixed(1) + "s" : "–"}</span></div>
       <div class="row"><span class="l">Water</span><span>${b.wtmp != null ? Math.round(b.wtmp*9/5+32) + "°F" : "–"}</span></div>
       <div class="note">${b.name} (CDIP ${b.id}) · ${ago < 90 ? `${ago} min ago` : `${Math.round(ago/60)} h ago${ago > 180 ? " — may be stale" : ""}`}</div>`}</section>`;

  /* ---- spot guide (collapsed by default to keep the page light) ---- */
  const C = spot.criteria, lvlKey = ["mid","good","perfect"];
  const tierRow = lv => {
    if(lv === 0) return `<div class="tier"><div>${pill(0)}</div><div class="muted">Anything outside the Mid / Fun ranges${spot.rainSensitive ? `, or ≥0.25" rain in 72 h` : ""}.</div></div>`;
    const key = lvlKey[lv-1];
    const dir = rangesTxt(C.dir[key],"°") + (lv === 3 && C.dir.combo ? `${C.dir[key].length ? " or " : ""}${rangesTxt([C.dir.combo[0]],"°")} + ${rangesTxt([C.dir.combo[1]],"°")} combo` : "");
    const wind = lv === 3 ? `Glassy, or offshore ≤${C.wind.offshore.perfect} kt` : `Offshore ≤${C.wind.offshore[key]} kt or onshore ≤${C.wind.onshore[key]} kt`;
    return `<div class="tier"><div>${pill(lv)}</div><dl>
      <dt>Swell</dt><dd>${dir}</dd><dt>Period</dt><dd>${rangesTxt([C.period[key]]," s")}</dd>
      <dt>Size</dt><dd>${rangesTxt([C.height[key]]," ft")}</dd>
      <dt>Tide</dt><dd>${rangesTxt([C.tide[key]]," ft")}${lv === 3 && C.tide.prefer ? `, ${C.tide.prefer}` : ""}</dd>
      <dt>Wind</dt><dd>${wind}</dd></dl></div>`;
  };
  const guide = `<details class="card guide"><summary>What ${spot.name.split(",")[0].split(" (")[0]} needs</summary>
    ${[3,2,1,0].map(tierRow).join("")}
    <p class="small muted" style="margin:12px 0 0">${spot.notes} Faces ${spot.facing}° ${compass(spot.facing)}; offshore wind blows from ${compass((spot.facing+180)%360)}.</p>
    ${spot.other ? `<ul class="other">${spot.other.map(o=>`<li>${o}</li>`).join("")}</ul>` : ""}
  </details>`;

  $("#app").innerHTML = `
    ${banner}${hero}${days}
    ${scrubber(spot, d)}
    <div class="grid2">
      <section class="card"><div class="h">Wind vs. beach</div>${windCompass(spot, cur.wind, a)}</section>
      <section class="card"><div class="h">Tide · NOAA ${spot.tideStation}</div>${d.tideErr ? `<div class="err small">Tide data unavailable: ${d.tideErr}</div>` : tideChart(spot, d)}</section>
    </div>
    ${hourly}
    <div class="grid2">${swell}${buoy}</div>
    ${guide}`;
  initScrub(d);
}

/* Smooth line through points (Catmull-Rom → cubic Bézier). Used by both tide charts. */
function smoothPath(P){
  let path = `M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){
    const p0 = P[i-1]||P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2]||p2;
    path += ` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  return path;
}

/* =====================================================================
   TIMELINE SCRUBBER — drag the line (or the slider) through the next
   72 hours. Every track and the readout above follow the same hour:
     rating strip · surf height bars · wind bars · tide curve
   Layout constants live in SC; track heights in SC.tracks (viewBox units).
   ===================================================================== */
const SC = { W: 380, pl: 4, pr: 4, axis: 220,
  tracks: { rate: [0, 10], surf: [20, 92], wind: [102, 140], tide: [150, 210] } };
const TIER_COLOR = ["var(--dontgo)", "var(--mid)", "var(--good)", "var(--perfect)"];
const WIND_COLOR = { "w-off": "var(--offshore)", "w-cross": "var(--cross)", "w-on": "var(--onshore)" };
let scrubGeom = null;   // x positions + tide y positions for the cursor dot

function scrubber(spot, d){
  const H = d.hours, n = H.length, T = SC.tracks;
  if(n < 2) return "";
  const step = (SC.W - SC.pl - SC.pr)/(n-1), x = i => SC.pl + i*step;
  const maxSurf = Math.max(4, ...H.map(h => h.a.surfHi));          // ft; bars scale to the biggest hour
  const tides = H.map(h => h.tide).filter(v => v != null);
  const tLo = Math.min(...tides) - .5, tHi = Math.max(...tides) + .5;
  const yT = v => T.tide[1] - (v - tLo)/(tHi - tLo)*(T.tide[1]-T.tide[0]);
  const bw = Math.max(1.2, step*0.72);
  let s = "";

  // night shading + day dividers + time labels
  H.forEach((h,i) => {
    const hr = +h.k.slice(11,13);
    if(!h.daylight) s += `<rect x="${x(i)-step/2}" y="0" width="${step+.5}" height="${SC.axis-6}" fill="#000" opacity=".25"/>`;
    if(hr === 0) s += `<line x1="${x(i)}" x2="${x(i)}" y1="0" y2="${SC.axis-6}" stroke="var(--line)"/>`;
    if(hr === 12) s += `<text x="${x(i)}" y="${SC.axis+8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${dayLabel(h.k,{weekday:"short"})}</text>`;
    else if(hr === 6 || hr === 18) s += `<text x="${x(i)}" y="${SC.axis+8}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${hourLabel(h.k)}</text>`;
  });
  // 1. rating strip
  H.forEach((h,i) => s += `<rect x="${x(i)-step/2}" y="${T.rate[0]}" width="${step+.5}" height="${T.rate[1]}" fill="${TIER_COLOR[TIERS.indexOf(h.a.tier)]}"/>`);
  // 2. surf height bars
  H.forEach((h,i) => { const hh = h.a.surfMid/maxSurf*(T.surf[1]-T.surf[0]);
    s += `<rect x="${x(i)-bw/2}" y="${T.surf[1]-hh}" width="${bw}" height="${hh}" rx="1" fill="var(--ocean)" opacity="${h.daylight ? .75 : .4}"/>`; });
  // 3. wind bars (speed, colored by offshore / cross / onshore; 25 kt = full height)
  H.forEach((h,i) => { if(h.wind.spd == null) return; const hh = Math.min(h.wind.spd,25)/25*(T.wind[1]-T.wind[0]);
    s += `<rect x="${x(i)-bw/2}" y="${T.wind[1]-hh}" width="${bw}" height="${Math.max(hh,1)}" rx="1" fill="${WIND_COLOR[h.a.windCls]}" opacity="${h.daylight ? .85 : .45}"/>`; });
  // 4. tide curve with this spot's Perfect band
  const tideY = H.map(h => h.tide != null ? yT(h.tide) : null);
  const P = tideY.map((y,i) => y == null ? null : [x(i), y]).filter(Boolean);
  if(P.length > 1){
    const band = spot.criteria.tide.perfect, b1 = Math.max(T.tide[0], yT(Math.min(band[1], tHi))), b0 = Math.min(T.tide[1], yT(Math.max(band[0], tLo)));
    if(b0 > b1) s += `<rect x="${SC.pl}" y="${b1}" width="${SC.W-SC.pl-SC.pr}" height="${b0-b1}" fill="var(--perfect)" opacity=".10"/>`;
    const path = smoothPath(P);
    s += `<path d="${path} L${P[P.length-1][0]},${T.tide[1]} L${P[0][0]},${T.tide[1]} Z" fill="var(--ocean)" opacity=".18"/><path d="${path}" fill="none" stroke="var(--ocean)" stroke-width="2"/>`;
  }
  // track labels
  const lbl = (y, t) => `<text x="${SC.pl+2}" y="${y}" font-size="9" font-weight="600" letter-spacing=".06em" fill="var(--faint)">${t}</text>`;
  s += lbl(T.surf[0]+9, "SURF") + lbl(T.wind[0]+9, "WIND") + lbl(T.tide[0]+9, "TIDE");

  scrubGeom = { x: H.map((_,i)=>x(i)), tideY, step, n };
  return `<section class="card" id="scrub">
    <div class="h">Drag through the forecast</div>
    <div id="sc-read" aria-live="polite"></div>
    <svg id="sc-svg" viewBox="0 0 ${SC.W} ${SC.axis+12}" role="img" aria-label="72-hour forecast timeline">
      ${s}
      <line id="sc-line" x1="0" x2="0" y1="0" y2="${SC.axis-6}" stroke="var(--ink)" stroke-width="1.5"/>
      <circle id="sc-dot" cx="0" cy="0" r="4" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/>
      <rect x="0" y="0" width="${SC.W}" height="${SC.axis}" fill="transparent"/>
    </svg>
    <input id="sc-range" type="range" min="0" max="${n-1}" value="0" aria-label="Forecast hour">
  </section>`;
}

function scrubReadout(h, i){
  const a = h.a, lv = TIERS.indexOf(a.tier);
  return `
    <div class="sc-top">
      <div><div class="small muted">${dayLabel(h.k,{weekday:"short"})} ${hourLabel(h.k)}${i === 0 ? " · now" : ""}${h.daylight ? "" : " · dark"}</div>
        <div class="sc-size">${fmtRange(a.surfLo, a.surfHi)}<small>${hU()}</small></div>
        <div class="sc-sum">${summary(h)}</div></div>
      <div style="text-align:right">${pill(lv, a.tier.name)}<div class="small faint" style="margin-top:4px">${a.score.toFixed(1)}/10</div></div>
    </div>
    <div class="sc-grid">
      <div><div class="k">Swell</div>
        ${a.trains.map(t => `<div class="sc-l"><b>${fmtH(t.H)}${hU()}</b> ${t.T.toFixed(0)}s <span style="color:var(--ocean);display:inline-flex">${arrowIcon(t.D,12)}</span> ${compass(t.D)} ${Math.round(t.D)}°</div>`).join("")}</div>
      <div><div class="k">Wind</div>
        <div class="sc-l ${a.windCls}"><span style="color:var(--c);display:inline-flex">${arrowIcon(h.wind.dir,12)}</span> <b>${fmtW(h.wind.spd)} ${wU()}</b> ${compass(h.wind.dir)} · <span style="color:var(--c)">${a.windTag}</span></div>
        <div class="k" style="margin-top:8px">Tide</div>
        <div class="sc-l"><b>${h.tide != null ? fmtH(h.tide/M2FT) + " " + hU() : "–"}</b> ${h.trend === "↑" ? "rising" : h.trend === "↓" ? "falling" : h.trend === "→" ? "slack" : ""}</div></div>
    </div>
    <div class="sc-lim">${limChips(a)}</div>`;
}

function initScrub(d){
  const svg = $("#sc-svg"), range = $("#sc-range"), read = $("#sc-read");
  if(!svg || !scrubGeom) return;
  const G = scrubGeom, line = $("#sc-line"), dot = $("#sc-dot");
  let cur = -1;
  const set = i => {
    if(i === cur) return; cur = i;
    const x = G.x[i];
    line.setAttribute("x1", x); line.setAttribute("x2", x);
    if(G.tideY[i] != null){ dot.setAttribute("cx", x); dot.setAttribute("cy", G.tideY[i]); dot.style.display = ""; } else dot.style.display = "none";
    range.value = i;
    read.innerHTML = scrubReadout(d.hours[i], i);
  };
  // pointer x (screen) → hour index (viewBox units)
  const idxAt = e => { const r = svg.getBoundingClientRect(); const vx = (e.clientX - r.left)/r.width*SC.W;
    return Math.max(0, Math.min(G.n-1, Math.round((vx - SC.pl)/G.step))); };
  let dragging = false;
  svg.addEventListener("pointerdown", e => { dragging = true; svg.setPointerCapture(e.pointerId); set(idxAt(e)); });
  svg.addEventListener("pointermove", e => { if(dragging) set(idxAt(e)); });
  ["pointerup","pointercancel"].forEach(t => svg.addEventListener(t, () => dragging = false));
  range.addEventListener("input", e => set(+e.target.value));
  set(0);
}

/* Wind compass: a thin ring with an aqua OFFSHORE arc and a coral ONSHORE arc,
   the shoreline as a dashed line, and the wind arrow coming in from where the
   wind blows FROM, colored by how it hits this beach. Speed sits in the middle. */
function windCompass(spot, wind, a){
  const S = 220, c = S/2, R = 82;
  const pt = (deg, r) => [c + r*Math.sin(deg*Math.PI/180), c - r*Math.cos(deg*Math.PI/180)];
  const arc = (center, half, r, color, w) => {
    const [x1,y1] = pt(center-half, r), [x2,y2] = pt(center+half, r);
    return `<path d="M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  };
  const off = (spot.facing+180)%360;
  const [s1x,s1y] = pt(spot.facing-90, R-10), [s2x,s2y] = pt(spot.facing+90, R-10);
  const ticks = Array.from({length:24},(_,i)=>{ const big = i%6 === 0; const [x1,y1]=pt(i*15,R-14), [x2,y2]=pt(i*15,R-(big?22:17));
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--faint)" stroke-width="${big?1.6:1}" opacity="${big?1:.5}"/>`; }).join("");
  const lbl = (deg, t) => { const [x,y] = pt(deg, R+15); return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-weight="650">${t}</text>`; };
  // labels sit off to one side of the beach axis so the wind arrow rarely covers them
  const [ox,oy] = pt(spot.facing+55, R*0.58), [lx,ly] = pt(off+55, R*0.58);
  let arrow = "";
  if(wind.dir != null){
    const [ax,ay] = pt(wind.dir, R+2), [bx,by] = pt(wind.dir, 36);
    arrow = `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="currentColor" stroke-width="5" stroke-linecap="round" marker-end="url(#wh)"/>`;
  }
  return `<svg viewBox="0 0 ${S} ${S}" class="${a.windCls}" style="width:100%;max-width:250px;display:block;margin:0 auto;color:var(--c)" role="img" aria-label="Wind ${a.windTag} from ${compass(wind.dir)}">
    <defs><marker id="wh" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="currentColor"/></marker></defs>
    <circle cx="${c}" cy="${c}" r="${R}" fill="var(--surface-2)" stroke="var(--line)"/>
    ${arc(off, 45, R, "var(--offshore)", 6)}${arc(spot.facing, 45, R, "var(--onshore)", 6)}
    ${arc(off-45, 35, R, "var(--cross)", 2)}${arc(off+45+35, 35, R, "var(--cross)", 2)}
    <line x1="${s1x}" y1="${s1y}" x2="${s2x}" y2="${s2y}" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="${ox}" y="${oy+4}" text-anchor="middle" font-size="10.5" font-weight="650" letter-spacing=".08em" fill="var(--ocean)">OCEAN</text>
    <text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="10.5" font-weight="650" letter-spacing=".08em" fill="var(--faint)">LAND</text>
    ${ticks}${lbl(0,"N")}${lbl(90,"E")}${lbl(180,"S")}${lbl(270,"W")}
    ${arrow}
    <circle cx="${c}" cy="${c}" r="27" fill="var(--surface)" stroke="var(--line)"/>
    <text x="${c}" y="${c+4}" text-anchor="middle" font-size="21" font-weight="800" fill="var(--ink)">${fmtW(wind.spd)}</text>
    <text x="${c}" y="${c+17}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${wU()}</text>
  </svg>
  <div style="text-align:center;margin-top:8px" class="${a.windCls}"><span class="pill">${a.windTag}</span>
    <span class="small muted"> from ${compass(wind.dir)} · gusts ${fmtW(wind.gust)} ${wU()}</span></div>
  <div class="note" style="text-align:center"><span style="color:var(--offshore)">●</span> offshore &nbsp; <span style="color:var(--cross)">●</span> cross &nbsp; <span style="color:var(--onshore)">●</span> onshore</div>`;
}

/* Tide chart: smooth curve over the next 72 h, this spot's Perfect tide band in
   aqua, nights shaded, highs/lows labelled; the next six highs/lows sit below as chips. */
function tideChart(spot, d){
  const pts = d.tideAll.map(p=>({k:keyOf(p.t), v:+p.v})).filter(p=>p.k >= d.hours[0].k).slice(0, DAYS*24);
  if(pts.length < 2) return `<div class="small muted">No tide predictions</div>`;
  // Phone-sized coordinate space so the labels stay readable when the SVG scales.
  const W = 380, H = 170, pl = 22, pr = 6, pt0 = 18, pb = 20;
  const band = spot.criteria.tide.perfect;
  const vs = pts.map(p=>p.v), lo = Math.floor(Math.min(...vs, band[0]) - .5), hi = Math.ceil(Math.max(...vs, band[1]) + .8);
  const step = (W-pl-pr)/(pts.length-1);
  const x = i => pl + i*step, y = v => pt0 + (hi-v)*(H-pt0-pb)/(hi-lo);
  let night = "";
  pts.forEach((p,i)=>{ const sr = d.sun[p.k.slice(0,10)]; if(sr && (p.k < sr[0] || p.k > sr[1])) night += `<rect x="${x(i)-step/2}" y="${pt0-10}" width="${step+.6}" height="${H-pb-pt0+10}" fill="#000" opacity=".25"/>`; });
  const P = pts.map((p,i)=>[x(i), y(p.v)]);
  const path = smoothPath(P);
  const area = `${path} L${P[P.length-1][0]},${H-pb} L${P[0][0]},${H-pb} Z`;
  let grid = "";
  for(let v = lo; v <= hi; v += 2) grid += `<text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--faint)">${prefs.h==="ft"?v:(v/M2FT).toFixed(1)}</text>`;
  const days = pts.map((p,i)=> p.k.endsWith("T12") ? `<text x="${x(i)}" y="${H-5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${dayLabel(p.k,{weekday:"short"})}</text>` : "").join("");
  const t0 = Date.UTC(+pts[0].k.slice(0,4), +pts[0].k.slice(5,7)-1, +pts[0].k.slice(8,10), +pts[0].k.slice(11,13));
  const hl = d.hilo.map(p => {
    const t = Date.UTC(+p.t.slice(0,4), +p.t.slice(5,7)-1, +p.t.slice(8,10), +p.t.slice(11,13), +p.t.slice(14,16));
    const xi = pl + (t - t0)/3600e3*step; if(xi < pl+6 || xi > W-pr-6) return "";
    const yy = y(+p.v), up = p.type === "H";
    return `<text x="${xi}" y="${up ? yy-7 : yy+14}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">${(+p.v).toFixed(1)}</text>`;
  }).join("");
  const chips = d.hilo.filter(p => keyOf(p.t) >= d.hours[0].k).slice(0,6).map(p =>
    `<div><span class="lbl">${p.type==="H"?"▲":"▼"} ${dayLabel(p.t,{weekday:"short"})} ${clock(p.t)}</span><b>${fmtH(+p.v/M2FT)}</b></div>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Tide forecast">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ocean)" stop-opacity=".32"/><stop offset="1" stop-color="var(--ocean)" stop-opacity="0"/></linearGradient></defs>
    ${night}
    <rect x="${pl}" y="${y(band[1])}" width="${W-pl-pr}" height="${y(band[0])-y(band[1])}" fill="var(--perfect)" opacity=".09"/>
    ${grid}<path d="${area}" fill="url(#tg)"/><path d="${path}" fill="none" stroke="var(--ocean)" stroke-width="2.4"/>
    ${days}${hl}
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
  </svg>
  <div class="note">Aqua band = best tide here (${band[0]}–${band[1]} ft${spot.criteria.tide.prefer ? `, ${spot.criteria.tide.prefer}` : ""}) · shaded = night · ${hU()}</div>
  <div class="hilo">${chips}</div>`;
}

/* ============================ wiring ============================ */
function tabs(){
  $("#tabs").innerHTML = SPOTS.map(s=>`<button class="tab ${s.id===prefs.spot?"on":""}" data-id="${s.id}">${s.name}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>goTo(b.dataset.id));
  $(".tab.on")?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}

/* Switch spot. dir = +1 (next) / -1 (previous) picks the slide-in direction. */
function goTo(id, dir){
  const from = SPOTS.findIndex(s => s.id === prefs.spot), to = SPOTS.findIndex(s => s.id === id);
  if(to < 0 || to === from) return;
  dir = dir ?? (to > from ? 1 : -1);
  prefs.spot = id; store.set("surf.spot", id);
  tabs();
  const app = $("#app");
  app.classList.remove("in-next", "in-prev"); void app.offsetWidth;   // restart the animation
  app.classList.add(dir > 0 ? "in-next" : "in-prev");
  if(window.scrollY > 120) window.scrollTo({ top: 0 });
  show();
}

/* ---------- swipe between spots (phones) ----------
   Finger right→left = next spot, left→right = previous; wraps around.
   Ignored when the swipe starts on things that scroll or drag sideways
   themselves (forecast timeline, slider, day cards, spot tabs).
   SWIPE.min = how far (px) the finger must travel; SWIPE.ratio = how much
   more horizontal than vertical it must be (so normal scrolling never switches). */
const SWIPE = { min: 60, ratio: 1.6, maxMs: 700, ignore: "#sc-svg, #sc-range, .days, .tabs, select, input, button" };
let touch0 = null;
document.addEventListener("touchstart", e => {
  if(e.touches.length !== 1 || e.target.closest(SWIPE.ignore)) { touch0 = null; return; }
  const t = e.touches[0]; touch0 = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  if(!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, dt = Date.now() - touch0.t;
  touch0 = null;
  if(Math.abs(dx) < SWIPE.min || Math.abs(dx) < SWIPE.ratio*Math.abs(dy) || dt > SWIPE.maxMs) return;
  const i = SPOTS.findIndex(s => s.id === prefs.spot), n = SPOTS.length;
  const step = dx < 0 ? 1 : -1;                                  // finger moved left → next spot
  goTo(SPOTS[(i + step + n) % n].id, step);
}, { passive: true });

/* Load the other spots in the background so swiping is instant. */
let prefetching = false;
function prefetch(){
  if(prefetching) return; prefetching = true;
  Promise.all(SPOTS.filter(s => !cache[s.id]).map(s =>
    loadSpot(s).then(raw => { if(!cache[s.id]){ cache[s.id] = { at: Date.now(), raw }; saveForecast(s.id, cache[s.id]); } }).catch(() => {})
  )).finally(() => prefetching = false);
}
/* ---------- offline: keep the last good forecast for each spot on the phone ---------- */
const savedKey = id => `surf.data.${id}`;
function saveForecast(id, entry){ try { localStorage.setItem(savedKey(id), JSON.stringify(entry)); } catch {} }
function savedForecast(id){
  try {
    const e = JSON.parse(localStorage.getItem(savedKey(id)));
    if(e?.raw?.buoy?.time) e.raw.buoy.time = new Date(e.raw.buoy.time);   // JSON turned the Date into text
    return e ? { ...e, offline: true } : null;
  } catch { return null; }
}
const agoText = ms => { const m = Math.round(ms/60000); return m < 60 ? `${m} min ago` : m < 48*60 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} days ago`; };

async function show(force){
  const spot = SPOTS.find(s=>s.id===prefs.spot) || SPOTS[0];
  if(force || !cache[spot.id] || cache[spot.id].offline || Date.now() - cache[spot.id].at > 20*60e3){
    // keep the current view while refreshing the SAME spot; otherwise show the loading shimmer
    if(!cache[spot.id] || $("#app").dataset.spot !== spot.id) $("#app").innerHTML = `<div class="skeleton"></div>`;
    try {
      cache[spot.id] = { at: Date.now(), raw: await loadSpot(spot) };
      saveForecast(spot.id, cache[spot.id]);
    } catch(e){
      const saved = cache[spot.id]?.raw ? { ...cache[spot.id], offline: true } : savedForecast(spot.id);
      if(!saved){ $("#app").innerHTML = `<div class="card err">Couldn't load ${spot.name} and there's no saved forecast yet. Check your signal and tap ↻.</div>`; return; }
      cache[spot.id] = saved;
    }
  }
  if(spot.id !== prefs.spot) return;
  const entry = cache[spot.id];
  try {
    const d = build(spot, entry.raw);
    if(!d.hours.length){ $("#app").innerHTML = `<div class="card err">The saved forecast for ${spot.name} is too old to show. Tap ↻ when you have signal.</div>`; return; }
    render(spot, d);
    $("#app").dataset.spot = spot.id;
    if(entry.offline) $("#app").insertAdjacentHTML("afterbegin",
      `<div class="card offline">📵 <b>No connection.</b> Showing the forecast saved ${agoText(Date.now() - entry.at)}. It refreshes when you're back online.</div>`);
  } catch(e){ console.error(e); $("#app").innerHTML = `<div class="card err">Something went wrong drawing ${spot.name}: ${e.message}</div>`; }
  if(!entry.offline) prefetch();
}
window.addEventListener("online", () => show(true));
for(const [id,key,sk] of [["#unitH","h","surf.h"],["#unitW","w","surf.w"]]){
  $(id).value = prefs[key];
  $(id).onchange = e => { prefs[key] = e.target.value; store.set(sk, prefs[key]); show(); };
}
$("#refresh").onclick = () => show(true);
if(!SPOTS.some(s=>s.id===prefs.spot)) prefs.spot = SPOTS[0].id;
tabs(); show();

/* Register the offline helper (sw.js) so the app opens without signal. */
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
